<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สแกนเข้า/เลิกงาน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#eef1f3; --ink:#14202b; --muted:#566573; --blue:#1d4f7c; --ok:#1e7a46; --warn:#b25e00; --err:#b3261e; --line:#c9d2d9; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:'Noto Sans Thai',system-ui,sans-serif; }
  header { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; background:var(--ink); color:#fff; }
  header a { color:#cfe0ef; font-size:.9rem; }
  h1 { font-size:1.1rem; margin:0; }
  main { max-width:560px; margin:0 auto; padding:12px; }
  .status { display:grid; gap:6px; margin-bottom:10px; }
  .chip { padding:8px 12px; border-radius:8px; background:#fff; border-left:6px solid var(--line); font-size:.95rem; }
  .chip.ok { border-color:var(--ok); } .chip.warn { border-color:var(--warn); } .chip.bad { border-color:var(--err); }
  .stage { position:relative; background:#000; border-radius:10px; overflow:hidden; aspect-ratio:3/4; }
  .stage video, .stage canvas { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  #shot { display:none; object-fit:contain; background:#000; }
  .row { display:flex; gap:8px; margin-top:10px; }
  button, select { font:inherit; border-radius:10px; border:2px solid var(--line); background:#fff; color:var(--ink); padding:14px; }
  button { font-weight:600; cursor:pointer; }
  button.primary { background:var(--blue); border-color:var(--blue); color:#fff; flex:1; font-size:1.15rem; padding:18px; }
  button.go { background:var(--ok); border-color:var(--ok); color:#fff; flex:1; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button:focus-visible, select:focus-visible { outline:3px solid #f2a900; outline-offset:2px; }
  .fieldLabel { display:block; font-weight:600; margin:2px 0 4px; }
  #siteSel { width:100%; margin-bottom:10px; }
  .types { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:6px; }
  .tbtn { padding:16px 8px; font-size:1.1rem; border-color:var(--blue); color:var(--blue); }
  .tbtn.ot { border-color:var(--warn); color:var(--warn); }
  .tbtn.sel { background:var(--blue); color:#fff; }
  .tbtn.ot.sel { background:var(--warn); color:#fff; }
  .tbtn.sel:disabled { opacity:1; }
  .panel { background:#fff; border-radius:10px; padding:14px; margin-top:10px; display:none; }
  .panel h2 { font-size:1rem; margin:0 0 8px; }
  .names label { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid #edf0f2; font-size:1.05rem; }
  .names input { width:22px; height:22px; }
  .note { font-size:.9rem; color:var(--muted); margin:8px 0 0; }
  .warnText { color:var(--warn); font-weight:600; }
  .errText { color:var(--err); font-weight:600; }
  .okText { color:var(--ok); font-weight:600; }
  #busy { position:fixed; inset:0; background:rgba(20,32,43,.7); color:#fff; display:none; align-items:center; justify-content:center; font-size:1.1rem; z-index:5; padding:24px; text-align:center; }
  @media (prefers-reduced-motion:no-preference) { .chip { transition:border-color .2s; } }
</style>
</head>
<body>
<header>
  <h1>สแกนเข้า/เลิกงาน</h1>
  <a href="#" id="changePin">เปลี่ยน PIN</a>
</header>
<main>
  <div class="status">
    <div class="chip" id="stModels">โหลดโมเดลใบหน้า...</div>
    <div class="chip" id="stFaces">รอข้อมูลใบหน้า...</div>
    <div class="chip" id="stGps">ค้นหาตำแหน่ง GPS...</div>
    <div class="chip" id="stLine">ตรวจลิงก์ไลน์...</div>
  </div>

  <label class="fieldLabel" for="siteSel">ตอนนี้อยู่หน้างานที่ไหน</label>
  <select id="siteSel" aria-label="เลือกไซต์งาน"><option value="">กำลังโหลดไซต์...</option></select>

  <div class="types" role="group" aria-label="ประเภทการลงเวลา">
    <button type="button" class="tbtn" id="type_IN" aria-pressed="false">เข้างาน</button>
    <button type="button" class="tbtn" id="type_OUT" aria-pressed="false">ออกงาน</button>
    <button type="button" class="tbtn ot" id="type_OT_IN" aria-pressed="false">เริ่มโอที</button>
    <button type="button" class="tbtn ot" id="type_OT_OUT" aria-pressed="false">เลิกโอที</button>
  </div>
  <p class="note" id="typeHint" style="margin:0 0 10px">เลือกประเภทก่อนถ่ายรูป</p>

  <div class="stage">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="shot"></canvas>
  </div>

  <div class="row" id="rowShoot">
    <button class="primary" id="btnShoot" disabled>ถ่ายรูปทีม</button>
    <button id="btnFlip" aria-label="สลับกล้อง">สลับกล้อง</button>
  </div>

  <section class="panel" id="result">
    <h2 id="resultTitle">ผลการสแกน</h2>
    <div class="names" id="names"></div>
    <p class="note" id="resultNote"></p>
    <div class="row">
      <button id="btnRetake">ถ่ายใหม่</button>
      <button class="go" id="btnSend">ส่งบันทึก</button>
    </div>
    <p class="note" id="countdown"></p>
  </section>

  <section class="panel" id="done">
    <h2 id="doneTitle"></h2>
    <div id="doneBody"></div>
    <div class="row"><button class="primary" id="btnAgain">สแกนรอบใหม่</button></div>
  </section>
</main>
<div id="busy"><span id="busyText">กำลังทำงาน...</span></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/dist/face-api.js"></script>
<script>
const $ = id => document.getElementById(id);
const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/model/';
const MATCH_THRESHOLD = 0.5;   // ยิ่งน้อยยิ่งเข้มงวด (0.45-0.55)
const MIN_FACE_PX = 60;        // หน้าเล็กกว่านี้ (บนรูปกว้าง 1280px) ถือว่าไกลเกินไป
const MAX_W = 1280;
const COUNTDOWN_SEC = 5;

let facing = 'environment', stream = null, matcher = null, sites = [];
let gps = null, ready = { models:false, faces:false }, shotData = null, timer = null;
const TYPE_TH = { IN:'เข้างาน', OUT:'ออกงาน', OT_IN:'เริ่มโอที', OT_OUT:'เลิกโอที' };
const PREREQ_TH = { OUT:'เข้างาน', OT_OUT:'เริ่มโอที' };
let chosen = '';   // ผู้ใช้ต้องเลือกเองทุกครั้ง ไม่มีค่าเริ่มต้น
const LINK_TOKEN = new URLSearchParams(location.search || '').get('t') || '';   // ลิงก์ส่วนตัวที่บอทส่งให้ในไลน์
let siteId = '', siteTouched = false;

function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
function lsDel(k){ try { localStorage.removeItem(k); } catch(e){} }

function chip(id, cls, text){ const el=$(id); el.className='chip '+cls; el.textContent=text; }
function busy(on, text){ $('busy').style.display = on ? 'flex' : 'none'; if(text) $('busyText').textContent = text; }

function getPin(){
  let pin = lsGet('teamPin');
  if (!pin) { pin = (prompt('กรอก PIN ทีม') || '').trim(); if (pin) lsSet('teamPin', pin); }
  return pin;
}
async function apiGet(params){
  const r = await fetch(API_URL + '?' + new URLSearchParams(params));
  return r.json();
}
async function apiPost(body){
  const r = await fetch(API_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  return r.json();
}
function distKm(a,b,c,d){
  const R=6371, r=Math.PI/180, dLat=(c-a)*r, dLng=(d-b)*r;
  const x=Math.sin(dLat/2)**2 + Math.cos(a*r)*Math.cos(c*r)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}

// ---------- เริ่มระบบ ----------
async function init(){
  setLineChip();
  const pin = getPin();
  if (!pin) { chip('stFaces','bad','ต้องกรอก PIN ทีม — รีเฟรชหน้าเพื่อกรอกใหม่'); return; }

  startCamera();
  startGps();

  try {
    await Promise.all([
      faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL),
      faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
      faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
    ]);
    ready.models = true; chip('stModels','ok','โมเดลใบหน้าพร้อม');
  } catch(e){ chip('stModels','bad','โหลดโมเดลไม่สำเร็จ — ตรวจอินเทอร์เน็ตแล้วรีเฟรช'); return; }

  let faces, cfg;
  try {
    [faces, cfg] = await Promise.all([
      apiGet({ action:'getKnownFaces', token:pin }),
      apiGet(LINK_TOKEN ? { action:'getConfig', token:pin, lt:LINK_TOKEN } : { action:'getConfig', token:pin })
    ]);
  } catch(e){ chip('stFaces','bad','ติดต่อเซิร์ฟเวอร์ไม่ได้ — ตรวจ URL ใน config.js'); return; }

  try {
    if (faces.error || cfg.error) {
      const msg = faces.error || cfg.error;
      if (/PIN/.test(msg)) lsDel('teamPin');
      chip('stFaces','bad', msg + (/PIN/.test(msg) ? ' — รีเฟรชแล้วกรอกใหม่' : ''));
      return;
    }
    sites = cfg.sites || [];
    buildSiteSelect(); setLineChip(!!cfg.linked);
    renderGps();
    if (!faces.length) { chip('stFaces','warn','ยังไม่มีใบหน้าในระบบ — ให้แอดมินลงทะเบียนก่อน'); return; }
    const labeled = faces.map(f => new faceapi.LabeledFaceDescriptors(f.label, f.descriptors.map(d => new Float32Array(d))));
    matcher = new faceapi.FaceMatcher(labeled, MATCH_THRESHOLD);
    ready.faces = true; chip('stFaces','ok','ฐานใบหน้า ' + faces.length + ' คน');
  } catch(e){ chip('stFaces','bad','หน้าเว็บทำงานผิดพลาด: ' + (e && e.message ? e.message : e)); return; }
  refreshShoot();
}

async function startCamera(){
  try {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:facing, width:{ ideal:1920 }, height:{ ideal:1080 } }, audio:false });
    const v = $('video'); v.srcObject = stream;
    v.style.transform = facing === 'user' ? 'scaleX(-1)' : 'none';
  } catch(e){ chip('stModels','bad','เปิดกล้องไม่ได้ — อนุญาตการใช้กล้อง และต้องเปิดผ่าน https'); }
}
function setLineChip(linked){
  if (!LINK_TOKEN) { chip('stLine','warn','เปิดจากลิงก์ตรง — จะไม่มีสรุปส่งกลับให้คุณในไลน์ (กดปุ่ม "สแกน" ในเมนูไลน์เพื่อรับลิงก์ส่วนตัว)'); return; }
  if (linked === undefined) { chip('stLine','','กำลังตรวจลิงก์ไลน์...'); return; }
  if (linked) chip('stLine','ok','สรุปจะส่งกลับเข้าแชทไลน์ส่วนตัวของคุณ');
  else chip('stLine','bad','ลิงก์ไลน์หมดอายุ — กดปุ่ม "สแกน" ในเมนูไลน์เพื่อรับลิงก์ใหม่');
}
function buildSiteSelect(){
  const sel = $('siteSel'); sel.innerHTML = '';
  const first = document.createElement('option'); first.value = '';
  first.textContent = sites.length ? 'เลือกไซต์ที่คุณอยู่' : 'ยังไม่มีไซต์ — ให้แอดมินเพิ่มไซต์ก่อน';
  sel.appendChild(first);
  sites.forEach(s => { const o = document.createElement('option'); o.value = s.id; o.textContent = s.name; sel.appendChild(o); });
  if (siteId && !sites.some(s => s.id === siteId)) siteId = '';
  sel.value = siteId;
}
function renderGps(){
  if (!gps) return;
  gps.inSite = false;
  const rows = sites.map(s => ({ s, d: distKm(gps.lat, gps.lng, s.lat, s.lng) })).sort((a,b) => a.d - b.d);
  const m = d => Math.round(d*1000);
  // อัปเดตข้อความในตัวเลือกให้เห็นระยะ (ไม่สลับลำดับ เพื่อไม่ให้รายการเลื่อนตอนผู้ใช้กำลังเลือก)
  const sel = $('siteSel');
  Array.from(sel.options || []).forEach(o => { const r = rows.find(x => x.s.id === o.value); if (r) o.textContent = r.s.name + ' (ห่าง ' + m(r.d) + ' ม.)'; });
  // ยังไม่ได้เลือกเอง: เลือกไซต์ที่อยู่ในรัศมีและใกล้สุดให้ก่อน (เปลี่ยนเองได้)
  if (!siteTouched && !siteId && rows.length && rows[0].d <= rows[0].s.radiusKm) { siteId = rows[0].s.id; sel.value = siteId; }
  const acc = '±' + Math.round(gps.acc) + ' ม.';
  if (!rows.length) { chip('stGps','warn','ได้ตำแหน่งแล้ว (' + acc + ') รอข้อมูลไซต์'); refreshShoot(); return; }
  const cur = rows.find(x => x.s.id === siteId);
  if (!cur) {
    chip('stGps','warn','เลือกไซต์ที่คุณอยู่ (ใกล้สุด: ' + rows[0].s.name + ' ห่าง ' + m(rows[0].d) + ' ม.)');
  } else if (cur.d <= cur.s.radiusKm) {
    gps.inSite = true;
    chip('stGps','ok','อยู่ในไซต์: ' + cur.s.name + ' (ห่าง ' + m(cur.d) + ' ม. จากรัศมี ' + m(cur.s.radiusKm) + ' ม., ' + acc + ')');
  } else {
    const other = rows[0].s.id !== siteId && rows[0].d <= rows[0].s.radiusKm ? ' — คุณอยู่ใกล้ ' + rows[0].s.name + ' ลองเปลี่ยนไซต์' : '';
    chip('stGps','bad','อยู่นอกรัศมีของ ' + cur.s.name + ' (ห่าง ' + m(cur.d) + ' ม. เกินรัศมี ' + m(cur.s.radiusKm) + ' ม.)' + other);
  }
  refreshShoot();
}
function startGps(){
  if (!navigator.geolocation) { chip('stGps','bad','อุปกรณ์ไม่รองรับ GPS'); return; }
  navigator.geolocation.watchPosition(p => {
    gps = { lat:p.coords.latitude, lng:p.coords.longitude, acc:p.coords.accuracy };
    try { renderGps(); } catch(e){ chip('stGps','bad','แสดงผลตำแหน่งผิดพลาด: ' + (e && e.message ? e.message : e)); }
  }, err => {
    chip('stGps','bad','ขอตำแหน่งไม่ได้ — เปิด GPS และอนุญาตเบราว์เซอร์');
  }, { enableHighAccuracy:true, maximumAge:10000, timeout:20000 });
}
function refreshShoot(){
  $('btnShoot').disabled = !(ready.models && ready.faces && gps && gps.inSite && chosen);
  $('typeHint').textContent = chosen ? ('ประเภท: ' + TYPE_TH[chosen]) : 'เลือกประเภทก่อนถ่ายรูป';
  $('typeHint').className = 'note' + (chosen ? '' : ' warnText');
}
function paintTypes(){
  Object.keys(TYPE_TH).forEach(t => {
    const b = $('type_' + t), on = (t === chosen);
    b.className = 'tbtn' + (t.indexOf('OT') === 0 ? ' ot' : '') + (on ? ' sel' : '');
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
}
function setType(t){ chosen = t; paintTypes(); refreshShoot(); }
function lockTypes(on){ Object.keys(TYPE_TH).forEach(t => { $('type_' + t).disabled = on; }); $('siteSel').disabled = on; }

// ---------- ถ่าย + วิเคราะห์ ----------
async function shoot(){
  const v = $('video');
  if (!v.videoWidth || !chosen) return;
  const scale = Math.min(1, MAX_W / v.videoWidth);
  const w = Math.round(v.videoWidth*scale), h = Math.round(v.videoHeight*scale);
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  c.getContext('2d').drawImage(v,0,0,w,h);

  busy(true,'กำลังวิเคราะห์ใบหน้า...');
  let dets;
  try {
    dets = await faceapi.detectAllFaces(c, new faceapi.SsdMobilenetv1Options({ minConfidence:0.5 }))
      .withFaceLandmarks().withFaceDescriptors();
  } catch(e){ busy(false); alert('วิเคราะห์ไม่สำเร็จ ลองถ่ายใหม่'); return; }
  busy(false);

  const results = dets.map(d => {
    const m = matcher.findBestMatch(d.descriptor);
    return { box:d.detection.box, label:m.label, distance:m.distance, small:d.detection.box.width < MIN_FACE_PX };
  });
  // หน้าเล็กเกินไป = ไม่นับ, ชื่อซ้ำ = เก็บเฉพาะอันที่ใกล้สุด
  const best = {};
  results.forEach((r,i) => { if (r.small) r.label='unknown';
    if (r.label!=='unknown' && (!(r.label in best) || r.distance < results[best[r.label]].distance)) best[r.label]=i; });
  results.forEach((r,i) => { if (r.label!=='unknown' && best[r.label]!==i) r.label='unknown'; });

  // วาดผลบนรูปที่ถ่าย
  const shot = $('shot'); shot.width=w; shot.height=h;
  const ctx = shot.getContext('2d'); ctx.drawImage(c,0,0);
  const fs = Math.round(Math.max(16, w/45)); ctx.lineWidth = Math.max(3, w/320); ctx.font = '600 ' + fs + 'px sans-serif';
  results.forEach(r => {
    const ok = r.label !== 'unknown', col = ok ? '#1e7a46' : (r.small ? '#b25e00' : '#b3261e');
    const b = r.box; ctx.strokeStyle = col; ctx.strokeRect(b.x,b.y,b.width,b.height);
    const text = ok ? r.label : (r.small ? 'ไกลเกินไป' : 'ไม่รู้จัก');
    const tw = ctx.measureText(text).width + 12, th = fs + 10;
    ctx.fillStyle = col; ctx.fillRect(b.x, Math.max(0,b.y-th), tw, th);
    ctx.fillStyle = '#fff'; ctx.fillText(text, b.x+6, Math.max(th-8, b.y-8));
  });
  $('video').style.display='none'; shot.style.display='block'; $('rowShoot').style.display='none';

  shotData = {
    names: results.filter(r => r.label!=='unknown').map(r => r.label),
    unknown: results.filter(r => r.label==='unknown').length,
    small: results.filter(r => r.small).length,
    photo: c.toDataURL('image/jpeg', 0.7)
  };
  showResult();
}

function showResult(){
  const d = shotData, box = $('names'); box.innerHTML='';
  $('resultTitle').textContent = 'ผลการสแกน: ' + TYPE_TH[chosen]; lockTypes(true);
  d.names.forEach(n => {
    const lb = document.createElement('label'), cb = document.createElement('input');
    cb.type='checkbox'; cb.checked=true; cb.value=n; cb.addEventListener('change', () => { stopCountdown('แก้รายชื่อแล้ว — กด “ส่งบันทึก” เมื่อพร้อม'); updateSend(); });
    lb.appendChild(cb); lb.appendChild(document.createTextNode(n)); box.appendChild(lb);
  });
  let note = 'พบ ' + (d.names.length + d.unknown) + ' หน้า, รู้จัก ' + d.names.length + ' คน';
  if (d.unknown) note += ' — ใบหน้าที่ไม่รู้จัก ' + d.unknown + ' คน' + (d.small ? ' (ไกลเกินไป ' + d.small + ' คน)' : '') + ' จะไม่ถูกบันทึก';
  $('resultNote').textContent = note;
  $('resultNote').className = 'note' + (d.unknown ? ' warnText' : '');
  $('result').style.display='block'; $('done').style.display='none';
  updateSend();
  if (!d.names.length) { $('countdown').textContent = 'ไม่พบใบหน้าที่รู้จัก — ถ่ายใหม่ให้ใกล้และเห็นหน้าชัดขึ้น'; return; }
  if (d.unknown === 0) startCountdown(); else $('countdown').textContent = 'มีใบหน้าที่ไม่รู้จัก ระบบจึงไม่ส่งอัตโนมัติ ตรวจรายชื่อแล้วกด “ส่งบันทึก”';
}
function checkedNames(){ return [...$('names').querySelectorAll('input:checked')].map(i => i.value); }
function updateSend(){ $('btnSend').disabled = checkedNames().length === 0; }

function startCountdown(){
  let n = COUNTDOWN_SEC; stopCountdown();
  const tick = () => {
    $('countdown').textContent = 'ส่งอัตโนมัติใน ' + n + ' วินาที (กด “ถ่ายใหม่” เพื่อยกเลิก)';
    if (n-- <= 0) { stopCountdown(''); send(); }
  };
  tick(); timer = setInterval(tick, 1000);
}
function stopCountdown(msg){ if (timer) { clearInterval(timer); timer=null; } if (msg !== undefined) $('countdown').textContent = msg; }

// ---------- ส่ง ----------
let sending = false;
async function send(){
  const names = checkedNames();
  if (sending || !names.length || !shotData || !gps || !siteId) return;
  sending = true; stopCountdown('');
  busy(true,'กำลังบันทึก...');
  let res;
  try {
    res = await apiPost({ action:'logAttendanceBatch', token:getPin(), names, lat:gps.lat, lng:gps.lng,
      accuracy:gps.acc, type:chosen, siteId, lineToken:LINK_TOKEN, unknownCount:shotData.unknown, photoBase64:shotData.photo });
  } catch(e){ res = { error:'ส่งไม่สำเร็จ (สัญญาณอินเทอร์เน็ต) กด “ส่งบันทึก” อีกครั้ง' }; }
  busy(false); sending = false;
  if (res.error) {
    $('countdown').innerHTML = '<span class="errText">' + esc(res.error) + '</span>';
    return;
  }
  showDone(res);
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function showDone(r){
  $('result').style.display='none'; $('done').style.display='block';
  const label = t => TYPE_TH[t] || t;
  let html = '';
  if (r.recorded && r.recorded.length) {
    $('doneTitle').textContent = 'บันทึก' + label(r.type) + ' ' + r.recorded.length + ' คน' + (r.siteName ? ' — ' + r.siteName : '');
    html += r.recorded.map(x => '<p class="okText">' + esc(x.name) + ' · ' + label(x.type) + '</p>').join('');
  } else {
    $('doneTitle').textContent = r.message || 'ไม่มีรายการใหม่';
  }
  if (r.warnings && r.warnings.length && PREREQ_TH[r.type]) html += '<p class="warnText">ไม่พบ' + PREREQ_TH[r.type] + 'ก่อนหน้า: ' + esc(r.warnings.join(', ')) + '</p>';
  if (r.skipped && r.skipped.length) html += '<p class="note">ข้าม (สแกนซ้ำเร็วเกินไป): ' + esc(r.skipped.join(', ')) + '</p>';
  if (r.rejected && r.rejected.length) html += '<p class="errText">ไม่พบในระบบ: ' + esc(r.rejected.join(', ')) + '</p>';
  if (r.line === 'sent' && r.lineTo === 'user') html += '<p class="note">ส่งสรุปเข้าแชทไลน์ส่วนตัวกับบอทแล้ว — ไปกด “ถูกต้อง” ที่นั่น</p>';
  else if (r.line === 'sent') html += '<p class="note">ส่งสรุปเข้ากลุ่มไลน์ของไซต์แล้ว — ให้กดยืนยันในกลุ่ม</p>';
  else if (r.line && r.line !== 'skipped') html += '<p class="warnText">บันทึกสำเร็จ แต่ส่งไลน์ไม่สำเร็จ (' + esc(r.line) + ') — ตรวจว่าเพิ่มบอทเป็นเพื่อนและไม่ได้บล็อก</p>';
  if (r.linkInvalid) html += '<p class="warnText">ลิงก์ไลน์หมดอายุ จึงไม่ได้ส่งสรุปถึงคุณ (ข้อมูลบันทึกแล้ว) — กดปุ่ม “สแกน” ในเมนูไลน์เพื่อรับลิงก์ใหม่</p>';
  $('doneBody').innerHTML = html;
}

function reset(clearType){
  stopCountdown(''); shotData = null; lockTypes(false);
  if (clearType) { chosen = ''; paintTypes(); }
  $('shot').style.display='none'; $('video').style.display='block'; $('rowShoot').style.display='flex';
  $('result').style.display='none'; $('done').style.display='none';
  refreshShoot();
}

$('btnShoot').addEventListener('click', shoot);
$('btnRetake').addEventListener('click', () => reset(false));
$('btnAgain').addEventListener('click', () => reset(true));
Object.keys(TYPE_TH).forEach(t => $('type_' + t).addEventListener('click', () => setType(t)));
$('btnSend').addEventListener('click', send);
$('siteSel').addEventListener('change', () => { siteTouched = true; siteId = $('siteSel').value; renderGps(); });
$('btnFlip').addEventListener('click', () => { facing = facing === 'user' ? 'environment' : 'user'; startCamera(); });
$('changePin').addEventListener('click', e => { e.preventDefault(); lsDel('teamPin'); location.reload(); });
init();
</script>
</body>
</html>
