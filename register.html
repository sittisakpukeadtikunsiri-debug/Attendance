<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ลงทะเบียนใบหน้า</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#eef1f3; --ink:#14202b; --muted:#566573; --blue:#1d4f7c; --ok:#1e7a46; --warn:#b25e00; --err:#b3261e; --line:#c9d2d9; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:'Noto Sans Thai',system-ui,sans-serif; }
  header { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; background:var(--ink); color:#fff; }
  header a { color:#cfe0ef; font-size:.9rem; }
  h1 { font-size:1.1rem; margin:0; }
  main { max-width:560px; margin:0 auto; padding:12px; }
  .chip { padding:8px 12px; border-radius:8px; background:#fff; border-left:6px solid var(--line); font-size:.95rem; margin-bottom:10px; }
  .chip.ok { border-color:var(--ok); } .chip.warn { border-color:var(--warn); } .chip.bad { border-color:var(--err); }
  label.f { display:block; font-weight:600; margin:12px 0 4px; }
  input[type=text], select { width:100%; font:inherit; padding:14px; border-radius:10px; border:2px solid var(--line); background:#fff; color:var(--ink); }
  .stage { position:relative; background:#000; border-radius:10px; overflow:hidden; aspect-ratio:3/4; margin-top:12px; }
  .stage video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform:scaleX(-1); }
  .row { display:flex; gap:8px; margin-top:10px; }
  button { font:inherit; font-weight:600; border-radius:10px; border:2px solid var(--line); background:#fff; color:var(--ink); padding:16px; cursor:pointer; }
  button.primary { background:var(--blue); border-color:var(--blue); color:#fff; flex:1; font-size:1.1rem; }
  button.go { background:var(--ok); border-color:var(--ok); color:#fff; flex:1; font-size:1.1rem; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline:3px solid #f2a900; outline-offset:2px; }
  .thumbs { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .thumb { position:relative; width:84px; height:84px; border-radius:8px; overflow:hidden; border:2px solid var(--line); }
  .thumb img { width:100%; height:100%; object-fit:cover; }
  .thumb button { position:absolute; top:2px; right:2px; padding:2px 8px; border-radius:6px; font-size:.9rem; }
  .consent { display:flex; gap:10px; align-items:flex-start; margin-top:14px; background:#fff; padding:12px; border-radius:10px; }
  .consent input { width:22px; height:22px; flex:none; margin-top:2px; }
  .note { font-size:.9rem; color:var(--muted); margin:8px 0 0; }
  .errText { color:var(--err); font-weight:600; } .okText { color:var(--ok); font-weight:600; }
  #busy { position:fixed; inset:0; background:rgba(20,32,43,.7); color:#fff; display:none; align-items:center; justify-content:center; font-size:1.1rem; z-index:5; padding:24px; text-align:center; }
</style>
</head>
<body>
<header>
  <h1>ลงทะเบียนใบหน้า (แอดมิน)</h1>
  <a href="index.html">เมนู</a>
</header>
<main>
  <div class="chip" id="st">กำลังเริ่มระบบ...</div>

  <label class="f" for="name">ชื่อที่ใช้ในรายงาน (ชื่อเดียวกับที่จะแสดงในไลน์)</label>
  <input type="text" id="name" maxlength="60" autocomplete="off" placeholder="เช่น สมชาย">

  <div class="stage"><video id="video" playsinline muted autoplay></video></div>
  <p class="note">ถ่าย 3 - 5 ภาพ: หน้าตรง, เอียงซ้ายเล็กน้อย, เอียงขวาเล็กน้อย, และถ้าต้องใช้หมวก/แว่นตอนทำงานให้ถ่ายแบบนั้นด้วย ให้เห็นหน้าคนเดียวในเฟรม</p>
  <div class="row">
    <button class="primary" id="btnCap" disabled>ถ่ายภาพ (<span id="cnt">0</span>/5)</button>
  </div>
  <div class="thumbs" id="thumbs"></div>

  <label class="consent">
    <input type="checkbox" id="consent">
    <span>เจ้าของใบหน้ารับทราบและยินยอมให้เก็บข้อมูลใบหน้า (ข้อมูลชีวมิติ) เพื่อใช้ลงเวลาทำงานเท่านั้น</span>
  </label>

  <div class="row"><button class="go" id="btnSave" disabled>บันทึกใบหน้า</button></div>
  <p class="note" id="msg"></p>
</main>
<div id="busy"><span id="busyText">กำลังทำงาน...</span></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/dist/face-api.js"></script>
<script>
const $ = id => document.getElementById(id);
const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/model/';
const MAX_SHOTS = 5, MIN_SHOTS = 3, MIN_FACE_PX = 120, MAX_W = 1280;
let stream = null, ready = false, shots = [];   // shots = [{ desc:number[], thumb:dataURL }]

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function busy(on, text){ $('busy').style.display = on ? 'flex' : 'none'; if(text) $('busyText').textContent = text; }
function chip(cls, text){ const el=$('st'); el.className='chip '+cls; el.textContent=text; }
function say(html){ $('msg').innerHTML = html; }
async function apiGet(p){ const r = await fetch(API_URL + '?' + new URLSearchParams(p)); return r.json(); }
async function apiPost(b){
  const r = await fetch(API_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(b) });
  return r.json();
}
// PIN แอดมินเก็บในหน่วยความจำของหน้านี้เท่านั้น (ไม่จำข้ามการเปิดหน้า)
let adminPin = '';
function pin(){ if (!adminPin) adminPin = (prompt('กรอก PIN แอดมิน') || '').trim(); return adminPin; }

async function init(){
  if (!pin()) { chip('bad','ต้องกรอก PIN แอดมิน — รีเฟรชหน้าเพื่อกรอกใหม่'); return; }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user', width:{ ideal:1280 } }, audio:false });
    $('video').srcObject = stream;
  } catch(e){ chip('bad','เปิดกล้องไม่ได้ — อนุญาตการใช้กล้อง และต้องเปิดผ่าน https'); return; }
  try {
    await Promise.all([
      faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL),
      faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
      faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
    ]);
  } catch(e){ chip('bad','โหลดโมเดลไม่สำเร็จ — ตรวจอินเทอร์เน็ตแล้วรีเฟรช'); return; }
  try {
    const cfg = await apiGet({ action:'getConfig', token:adminPin });
    if (cfg.error) { chip('bad', cfg.error + (/PIN/.test(cfg.error) ? ' — รีเฟรชแล้วกรอกใหม่' : '')); return; }
  } catch(e){ chip('bad','ติดต่อเซิร์ฟเวอร์ไม่ได้ — ตรวจ URL ใน config.js'); return; }
  ready = true; chip('ok','พร้อมถ่ายภาพ'); refresh();
}

function refresh(){
  $('cnt').textContent = shots.length;
  $('btnCap').disabled = !ready || shots.length >= MAX_SHOTS;
  $('btnSave').disabled = !(ready && shots.length >= MIN_SHOTS && $('name').value.trim() && $('consent').checked);
  const box = $('thumbs'); box.innerHTML = '';
  shots.forEach((s,i) => {
    const d = document.createElement('div'); d.className = 'thumb';
    d.innerHTML = '<img alt="ภาพที่ ' + (i+1) + '" src="' + s.thumb + '"><button aria-label="ลบภาพที่ ' + (i+1) + '">ลบ</button>';
    d.querySelector('button').addEventListener('click', () => { shots.splice(i,1); refresh(); });
    box.appendChild(d);
  });
}

async function capture(){
  const v = $('video'); if (!v.videoWidth) return;
  const scale = Math.min(1, MAX_W / v.videoWidth);
  const w = Math.round(v.videoWidth*scale), h = Math.round(v.videoHeight*scale);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  c.getContext('2d').drawImage(v,0,0,w,h);
  busy(true,'กำลังตรวจใบหน้า...');
  let dets;
  try {
    dets = await faceapi.detectAllFaces(c, new faceapi.SsdMobilenetv1Options({ minConfidence:0.6 }))
      .withFaceLandmarks().withFaceDescriptors();
  } catch(e){ busy(false); say('<span class="errText">ตรวจใบหน้าไม่สำเร็จ ลองใหม่</span>'); return; }
  busy(false);
  if (dets.length !== 1) { say('<span class="errText">ต้องเห็นหน้า "คนเดียว" ในภาพ (พบ ' + dets.length + ' หน้า)</span>'); return; }
  const b = dets[0].detection.box;
  if (b.width < MIN_FACE_PX) { say('<span class="errText">หน้าเล็กเกินไป ขยับเข้าใกล้กล้องอีก</span>'); return; }

  // รูปย่อสำหรับดูบนหน้านี้เท่านั้น (ไม่ส่งขึ้นเซิร์ฟเวอร์)
  const t = document.createElement('canvas'); t.width = 168; t.height = 168;
  const side = Math.min(w, h, b.width * 2), cx = b.x + b.width/2, cy = b.y + b.height/2;
  const sx = Math.min(Math.max(0, cx - side/2), w - side), sy = Math.min(Math.max(0, cy - side/2), h - side);
  t.getContext('2d').drawImage(c, sx, sy, side, side, 0, 0, 168, 168);
  shots.push({ desc: Array.from(dets[0].descriptor).map(x => Math.round(x*1e6)/1e6), thumb: t.toDataURL('image/jpeg',0.6) });
  say('<span class="okText">ได้ภาพที่ ' + shots.length + ' แล้ว</span>');
  refresh();
}

async function save(){
  const name = $('name').value.trim();
  busy(true,'กำลังบันทึก...');
  let res;
  try {
    res = await apiPost({ action:'registerUser', token:adminPin, name, descriptors:shots.map(s => s.desc) });
  } catch(e){ res = { error:'ส่งไม่สำเร็จ ตรวจอินเทอร์เน็ตแล้วลองอีกครั้ง' }; }
  busy(false);
  if (res.error) { say('<span class="errText">' + esc(res.error) + '</span>'); return; }
  say('<span class="okText">' + esc(res.message) + '</span> — ลงทะเบียนคนต่อไปได้เลย');
  shots = []; $('name').value = ''; $('consent').checked = false; refresh();
}

$('btnCap').addEventListener('click', capture);
$('btnSave').addEventListener('click', save);
$('name').addEventListener('input', refresh);
$('consent').addEventListener('change', refresh);
init();
</script>
</body>
</html>
